name: CPU integrity and model tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10.8"
      - name: Install CPU test dependencies
        run: |
          python -m pip install torch==2.1.2+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==1.26.4 einops==0.8.2 -r requirements-dev.txt
      - name: Verify published artifacts
        run: python -B reproduce.py --verify-only
      - name: Test model and training logic
        run: python -m pytest -q
